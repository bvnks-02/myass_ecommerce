name: myazz
description: A complete e-commerce mobile app for MYAZZ Tech/Music/Headphones store

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  shared_preferences: ^2.2.0
  cached_network_image: ^3.2.3
  carousel_slider: ^4.2.1
  flutter_staggered_grid_view: ^0.7.0
  url_launcher: ^6.1.12
  flutter_animate: ^4.2.0+1
  shimmer: ^3.0.0
  provider: ^6.0.5
  intl: ^0.18.1
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^6.0.0
  lottie: ^2.7.0
  image_picker: ^1.0.7
  flutter_svg: ^2.0.9
  equatable: ^2.0.5
  dartz: ^0.10.1
  font_awesome_flutter: ^11.0.0
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  package_info_plus: ^4.2.0
  share_plus: ^7.2.1
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.jpeg
